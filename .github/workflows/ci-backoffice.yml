name: CI Backoffice Web (React + TypeScript)

on:
  push:
    branches:
      - main
    paths:
      - 'backoffice/**'
      - '.github/workflows/ci-backoffice.yml'
  pull_request:
    paths:
      - 'backoffice/**'
      - '.github/workflows/ci-backoffice.yml'

jobs:
  backoffice-ci:
    name: ESLint, TypeScript, Vitest & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backoffice/package-lock.json

      - name: Install dependencies cleanly
        working-directory: backoffice
        run: npm ci

      - name: Run ESLint
        working-directory: backoffice
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: backoffice
        run: npx tsc --noEmit

      - name: Run Vitest unit tests
        working-directory: backoffice
        run: npm test

      - name: Build production bundle
        working-directory: backoffice
        run: npm run build

      - name: Audit npm high severity vulnerabilities
        working-directory: backoffice
        continue-on-error: true
        run: npm audit --audit-level=high
