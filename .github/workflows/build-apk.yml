name: Build & Upload APK to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Creer egalement une Release GitHub"
        type: boolean
        default: false

jobs:
  mobile-quality:
    name: Flutter Analyze, Tests & Line Limit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SQLite dev library for FFI tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Configure Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Enforce <= 250 lines and zero ignore comments
        working-directory: mobile
        run: |
          OVER=$(find lib -name "*.dart" -exec wc -l {} + | awk '$1 > 250 && $2 != "total"' | sort -nr)
          if [ -n "$OVER" ]; then
            echo "Dart files exceeding 250 lines:"
            echo "$OVER"
            exit 1
          fi
          if grep -rn "// ignore" lib; then
            echo "Forbidden // ignore comments found."
            exit 1
          fi

      - name: Run Flutter static analysis
        working-directory: mobile
        run: flutter analyze --no-pub

      - name: Run Flutter unit and widget tests
        working-directory: mobile
        run: flutter test --no-pub

  build-apk:
    name: Build Android APK & Google Drive Upload
    needs: mobile-quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Liberer de l'espace disque sur le runner
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghc || true

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configuration de Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Telechargement des dependances Flutter
        working-directory: mobile
        run: |
          flutter clean
          flutter pub get

      - name: Build Android APK (Release)
        working-directory: mobile
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          flutter build apk --release --dart-define=API_URL=${API_URL:-https://api.tocmanager.locarapide.com/api/v1}

      - name: Preparer l'APK pour l'export
        run: |
          if [ -f mobile/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile/build/app/outputs/flutter-apk/app-release.apk tocmanager.apk
          elif [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk tocmanager.apk
          else
            APK_PATH=$(find . -name "*release*.apk" -type f | head -n 1)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" tocmanager.apk
            else
              echo "ERREUR: Aucun APK trouve !"
              exit 1
            fi
          fi
          ls -lh tocmanager.apk

      - name: Sauvegarder l'APK dans les artefacts GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: tocmanager-apk
          path: tocmanager.apk
          retention-days: 14

      - name: Configurer l'environnement Python pour Google Drive
        run: |
          python3 -m pip install --upgrade pip
          pip install google-api-python-client google-auth --break-system-packages 2>/dev/null || pip install google-api-python-client google-auth

      - name: Uploader l'APK sur Google Drive
        continue-on-error: true
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: "12WVpbRWejBpp3ckRn7i_QhlWKBCSpGkB"
        run: |
          if [ -z "$GDRIVE_CREDENTIALS" ]; then
            echo "GDRIVE_CREDENTIALS secret is not configured; skipping Google Drive upload."
            exit 0
          fi
          python3 .github/scripts/upload_to_gdrive.py --skip-if-missing --folder-id 12WVpbRWejBpp3ckRn7i_QhlWKBCSpGkB tocmanager.apk

      - name: Publier la Release GitHub (si active)
        if: github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TocManager Mobile v1.0 (build ${{ github.run_number }})
          files: tocmanager.apk
          generate_release_notes: true
