name: CI Backend (FastAPI & PostgreSQL)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  backend-ci:
    name: Lint, Line Limit, Alembic PostgreSQL & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tocmanager
          POSTGRES_PASSWORD: tocmanager_ci_password
          POSTGRES_DB: tocmanager_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tocmanager -d tocmanager_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies and tooling
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pip-audit

      - name: Run Ruff static checks
        working-directory: backend
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Enforce <= 250 lines per module
        working-directory: backend
        run: |
          OVER=$(find app/models app/schemas app/services app/api -name "*.py" -exec wc -l {} + | awk '$1 > 250 && $2 != "total"' | sort -nr)
          if [ -n "$OVER" ]; then
            echo "Files exceeding 250 lines:"
            echo "$OVER"
            exit 1
          fi

      - name: Run Alembic migrations on PostgreSQL 16
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tocmanager:tocmanager_ci_password@localhost:5432/tocmanager_ci
        run: alembic upgrade head

      - name: Run Pytest suite
        working-directory: backend
        run: python -m pytest -q

      - name: Audit Python dependencies
        working-directory: backend
        continue-on-error: true
        run: pip-audit -r requirements.txt
