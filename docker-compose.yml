services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tocmanager_backend
    restart: always
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/tocmanager.db
      - SECRET_KEY=${SECRET_KEY:-tocmanager-super-secret-key-change-in-production-2026}
    volumes:
      - tocmanager_backend_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
    container_name: tocmanager_backoffice
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tocmanager_backend_data:
    driver: local
