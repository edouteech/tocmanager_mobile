name: tocmanager
description: "Application de gestion de stock, trésorerie et facturation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.20.2
  image_picker: ^1.2.3
  croppy: ^1.4.1
  image: '>=4.0.0 <4.8.0'
  path_provider: ^2.1.5
  excel: ^4.0.0
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^10.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
